# Hosted overlay: the pr0 stack as plain Compose behind Coolify's Traefik.
# Layered over compose.yaml through COMPOSE_FILE in the checkout's .env; copy
# infrastructure/hosted/hosted.env.example to .env. This file holds no secrets:
# every secret is a file in PR0_SECRET_DIRECTORY, outside the checkout.
# Coolify provides TLS and routing only and never deploys this stack; redeploy
# with infrastructure/hosted/redeploy.ts. See docs/operations/hosted.md.
x-hosted-secrets: &hosted-secrets
  - DATABASE_URL
  - BETTER_AUTH_SECRET
  - PR0_MAIL_SECRET
  - PR0_LEDGER_A_URL
  - PR0_LEDGER_B_URL
  - SMTP_PASSWORD
  - PR0_INGRESS_SECRET
  - PR0_METRICS_SECRET
  - PR0_GOOGLE_CLIENT_SECRET
  - PR0_GITHUB_CLIENT_SECRET

services:
  database:
    secrets: [POSTGRES_PASSWORD]
  web:
    # Only the ingress reaches web; nothing is published on the host.
    ports: !reset []
    # The ingress also sits on Coolify's shared network, where another container
    # could answer to the plain name "web"; it targets this alias instead.
    networks:
      default:
        aliases: [pr0-web]
      database: {}
    secrets: *hosted-secrets
  mail:
    secrets: *hosted-secrets
  accounts:
    secrets: *hosted-secrets
  deletions:
    secrets: *hosted-secrets
  restore:
    secrets: *hosted-secrets
  backup:
    secrets: *hosted-secrets
  operations:
    secrets: *hosted-secrets
  ingress:
    image: "${PR0_INGRESS_IMAGE:-pr0-ingress-local}"
    build: infrastructure/ingress
    environment:
      PR0_INGRESS_SECRET_FILE: /run/secrets/PR0_INGRESS_SECRET
      PR0_INGRESS_TRUSTED_PROXIES: "${PR0_INGRESS_TRUSTED_PROXIES:?Set the proxy network subnet}"
      PR0_INGRESS_METRICS_ALLOW: "${PR0_INGRESS_METRICS_ALLOW:-}"
      PR0_INGRESS_UPSTREAM: pr0-web:3000
    secrets: [PR0_INGRESS_SECRET]
    networks: [default, proxy]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${PR0_PROXY_NETWORK:-coolify}"
      traefik.http.services.pr0-ingress.loadbalancer.server.port: "8080"
      # Lowest priority: every other router on this host, such as /update and
      # the rehearsal channel, takes precedence over the origin root.
      traefik.http.routers.pr0-https.rule: "Host(`${PR0_PUBLIC_HOST:?Set the public host name}`)"
      traefik.http.routers.pr0-https.priority: "1"
      traefik.http.routers.pr0-https.entrypoints: "${PR0_TRAEFIK_HTTPS_ENTRYPOINT:-https}"
      traefik.http.routers.pr0-https.tls: "true"
      traefik.http.routers.pr0-https.tls.certresolver: "${PR0_TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.pr0-https.service: pr0-ingress
      traefik.http.routers.pr0-http.rule: "Host(`${PR0_PUBLIC_HOST}`)"
      traefik.http.routers.pr0-http.priority: "1"
      traefik.http.routers.pr0-http.entrypoints: "${PR0_TRAEFIK_HTTP_ENTRYPOINT:-http}"
      traefik.http.routers.pr0-http.middlewares: pr0-https-redirect
      traefik.http.routers.pr0-http.service: pr0-ingress
      traefik.http.middlewares.pr0-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.pr0-https-redirect.redirectscheme.permanent: "true"
  # The redeploy script's authenticated check: the availability probe run with
  # the canary session inside web's network namespace while ingress is closed.
  canary:
    image: "${PR0_IMAGE:-pr0-local}"
    profiles: ["operations"]
    network_mode: "service:web"
    environment:
      PR0_PROBE_ORIGIN: http://127.0.0.1:3000
      PR0_PROBE_COOKIE_FILE: /run/secrets/PR0_CANARY_COOKIE
      PR0_PROBE_PROMPT_ID: "${PR0_CANARY_PROMPT_ID:-}"
    secrets: [PR0_CANARY_COOKIE]
    entrypoint: ["bun", "--bun", "apps/web/.operations/availability.js"]
    command: ["probe", "/tmp/redeploy-check.jsonl"]

networks:
  proxy:
    external: true
    name: "${PR0_PROXY_NETWORK:-coolify}"

secrets:
  POSTGRES_PASSWORD:
    file: "${PR0_SECRET_DIRECTORY:?Set the hosted secret directory}/POSTGRES_PASSWORD"
  DATABASE_URL:
    file: "${PR0_SECRET_DIRECTORY}/DATABASE_URL"
  BETTER_AUTH_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/BETTER_AUTH_SECRET"
  PR0_MAIL_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/PR0_MAIL_SECRET"
  PR0_LEDGER_A_URL:
    file: "${PR0_SECRET_DIRECTORY}/PR0_LEDGER_A_URL"
  PR0_LEDGER_B_URL:
    file: "${PR0_SECRET_DIRECTORY}/PR0_LEDGER_B_URL"
  SMTP_PASSWORD:
    file: "${PR0_SECRET_DIRECTORY}/SMTP_PASSWORD"
  PR0_INGRESS_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/PR0_INGRESS_SECRET"
  PR0_METRICS_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/PR0_METRICS_SECRET"
  PR0_GOOGLE_CLIENT_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/PR0_GOOGLE_CLIENT_SECRET"
  PR0_GITHUB_CLIENT_SECRET:
    file: "${PR0_SECRET_DIRECTORY}/PR0_GITHUB_CLIENT_SECRET"
  PR0_CANARY_COOKIE:
    file: "${PR0_SECRET_DIRECTORY}/PR0_CANARY_COOKIE"
