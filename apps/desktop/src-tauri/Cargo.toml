[package]
name = "pr0-desktop"
version = "0.1.0"
description = "pr0 desktop application"
edition = "2021"
rust-version = "1.94"
publish = false

[features]
search-webview-test = ["tauri/custom-protocol"]

[lib]
name = "pr0_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Instance HTTPS bundles no public roots; trust comes from the platform verifier (ADR-0003).
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls-manual-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-platform-verifier = "0.7"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
url = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
arboard = { version = "3.6.1", default-features = false }
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

# The resident native process owns shortcut registration.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
minisign = "0.9.1"
tauri = { version = "2", features = ["test"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging",
] }
