# Copy to compose.override.yaml; create these files outside Git before running.
# Set NAME_FILE=/run/secrets/NAME in .env and leave NAME empty.
# See docs/operations/self-hosting.md for permissions.
x-application-secrets: &application-secrets
  - DATABASE_URL
  - BETTER_AUTH_SECRET
  - PR0_MAIL_SECRET
  - SMTP_PASSWORD
  - PR0_INGRESS_SECRET
  - PR0_METRICS_SECRET

services:
  database:
    secrets: [POSTGRES_PASSWORD]
  web:
    secrets: *application-secrets
  mail:
    secrets: *application-secrets
  accounts:
    secrets: *application-secrets
  deletions:
    secrets: *application-secrets
  restore:
    secrets: *application-secrets
  backup:
    secrets: *application-secrets
  operations:
    secrets: *application-secrets

secrets:
  POSTGRES_PASSWORD:
    file: ./.secrets/POSTGRES_PASSWORD
  DATABASE_URL:
    file: ./.secrets/DATABASE_URL
  BETTER_AUTH_SECRET:
    file: ./.secrets/BETTER_AUTH_SECRET
  PR0_MAIL_SECRET:
    file: ./.secrets/PR0_MAIL_SECRET
  SMTP_PASSWORD:
    file: ./.secrets/SMTP_PASSWORD
  PR0_INGRESS_SECRET:
    file: ./.secrets/PR0_INGRESS_SECRET
  PR0_METRICS_SECRET:
    file: ./.secrets/PR0_METRICS_SECRET
