services:
  web:
    build:
      context: .
    ports:
      - "${PR0_BIND_ADDRESS:-0.0.0.0}:${PR0_PORT:-3000}:3000"
    environment:
      API_ALLOWED_ORIGINS: "${API_ALLOWED_ORIGINS:-}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bun
        - --bun
        - -e
        - "const response = await fetch('http://127.0.0.1:3000/api/v1/health'); process.exit(response.ok ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
