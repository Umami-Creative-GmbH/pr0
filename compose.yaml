x-account-environment: &account-environment
  PR0_ORIGIN: "${PR0_ORIGIN:-http://localhost:3000}"
  DATABASE_URL: "${DATABASE_URL:-}"
  DATABASE_URL_FILE: "${DATABASE_URL_FILE:-}"
  PR0_LEDGER_A_URL: "${PR0_LEDGER_A_URL:-}"
  PR0_LEDGER_A_URL_FILE: "${PR0_LEDGER_A_URL_FILE:-}"
  PR0_LEDGER_B_URL: "${PR0_LEDGER_B_URL:-}"
  PR0_LEDGER_B_URL_FILE: "${PR0_LEDGER_B_URL_FILE:-}"
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
  BETTER_AUTH_SECRET_FILE: "${BETTER_AUTH_SECRET_FILE:-}"
  PR0_MAIL_SECRET: "${PR0_MAIL_SECRET:-}"
  PR0_MAIL_SECRET_FILE: "${PR0_MAIL_SECRET_FILE:-}"
  PR0_REGISTRATION: "${PR0_REGISTRATION:-closed}"
  PR0_GOOGLE_CLIENT_ID: "${PR0_GOOGLE_CLIENT_ID:-}"
  PR0_GOOGLE_CLIENT_SECRET: "${PR0_GOOGLE_CLIENT_SECRET:-}"
  PR0_GOOGLE_CLIENT_SECRET_FILE: "${PR0_GOOGLE_CLIENT_SECRET_FILE:-}"
  PR0_GITHUB_CLIENT_ID: "${PR0_GITHUB_CLIENT_ID:-}"
  PR0_GITHUB_CLIENT_SECRET: "${PR0_GITHUB_CLIENT_SECRET:-}"
  PR0_GITHUB_CLIENT_SECRET_FILE: "${PR0_GITHUB_CLIENT_SECRET_FILE:-}"
  PR0_INGRESS_SECRET: "${PR0_INGRESS_SECRET:-}"
  PR0_INGRESS_SECRET_FILE: "${PR0_INGRESS_SECRET_FILE:-}"
  PR0_METRICS_SECRET: "${PR0_METRICS_SECRET:-}"
  PR0_METRICS_SECRET_FILE: "${PR0_METRICS_SECRET_FILE:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_TLS: "${SMTP_TLS:-starttls}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_PASSWORD_FILE: "${SMTP_PASSWORD_FILE:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  PR0_RECOVERY_STATE_FILE: /var/lib/pr0-recovery/admission.json

services:
  database:
    image: postgres@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    environment:
      POSTGRES_USER: pr0
      POSTGRES_DB: pr0
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_PASSWORD_FILE: "${POSTGRES_PASSWORD_FILE:-}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr0 -d pr0"]
      interval: 5s
      timeout: 5s
      retries: 10
  accounts:
    image: pr0-migrations
    build:
      context: .
      target: migration-runtime
    profiles: ["operations"]
    environment:
      <<: *account-environment
      PR0_MIGRATION_BACKUPS: /var/lib/pr0-backups
      PR0_DATABASE_VOLUME: /var/lib/postgresql/data
    volumes:
      - migration-backups:/var/lib/pr0-backups
      - postgres-data:/var/lib/postgresql/data:ro
    entrypoint: ["bun", "--bun", "apps/web/.operations/accounts.js"]
    command: ["migrate"]
    depends_on:
      database:
        condition: service_healthy
  mail:
    image: pr0-local
    build:
      context: .
    environment: *account-environment
    volumes:
      - recovery-state:/var/lib/pr0-recovery:ro
    command: ["bun", "--bun", "apps/web/.operations/mail-worker.js"]
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
  deletions:
    image: pr0-local
    build:
      context: .
    profiles: ["operations"]
    environment:
      <<: *account-environment
      PR0_SEARCH_DIRECTORY: /var/lib/pr0-search
    volumes:
      - search-data:/var/lib/pr0-search
    entrypoint: ["bun", "--bun", "apps/web/.operations/deletions.js"]
    command: ["replay"]
    depends_on:
      database:
        condition: service_healthy
  restore:
    image: pr0-local
    build:
      context: .
    profiles: ["operations"]
    environment:
      <<: *account-environment
      PR0_SEARCH_DIRECTORY: /var/lib/pr0-search
    volumes:
      - recovery-state:/var/lib/pr0-recovery
      - search-data:/var/lib/pr0-search
    entrypoint: ["bun", "--bun", "apps/web/.operations/restore.js"]
    command: ["close"]
  backup:
    image: pr0-migrations
    build:
      context: .
      target: migration-runtime
    profiles: ["operations"]
    user: "1000:1000"
    environment:
      <<: *account-environment
      PR0_BACKUP_DIRECTORY: /var/lib/pr0-backups
      PR0_BACKUP_KEY_FILE: /run/secrets/backup_key
      PR0_BACKUP_RELEASE: "${PR0_BACKUP_RELEASE:-}"
    volumes:
      - type: bind
        source: "${PR0_BACKUP_MOUNT:-./.backup-mount-required}"
        target: /var/lib/pr0-backups
        bind:
          create_host_path: false
      - type: bind
        source: "${PR0_BACKUP_KEY_PATH:-./.backup-key-required}"
        target: /run/secrets/backup_key
        read_only: true
        bind:
          create_host_path: false
      - recovery-state:/var/lib/pr0-recovery:ro
    entrypoint: ["bun", "--bun", "apps/web/.operations/backup.js"]
    command: ["create"]
  web:
    image: pr0-local
    build:
      context: .
    ports:
      - "${PR0_BIND_ADDRESS:-0.0.0.0}:${PR0_PORT:-3000}:3000"
    environment:
      <<: *account-environment
      API_ALLOWED_ORIGINS: "${API_ALLOWED_ORIGINS:-}"
    volumes:
      - search-data:/var/lib/pr0-search
      - recovery-state:/var/lib/pr0-recovery:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bun
        - --bun
        - -e
        - "const response = await fetch('http://127.0.0.1:3000/api/v1/ready'); process.exit(response.ok ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  migration-backups:
  postgres-data:
  search-data:
  recovery-state:
