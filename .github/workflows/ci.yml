name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bun run test:update-channel
      - run: docker build -t pr0-update-channel infrastructure/update-channel
      - run: docker run --rm pr0-update-channel -t
  check:
    runs-on: windows-latest
    env:
      # Build validation only; CI does not deploy or call this placeholder host.
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
