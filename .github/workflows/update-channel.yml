name: Publish update channel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First publication of the empty channel (no published desktop releases)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: official-update-channel
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: update-channel
    env:
      GH_TOKEN: ${{ github.token }}
      PR0_UPDATE_PUBLIC_KEY: ${{ secrets.PR0_UPDATE_PUBLIC_KEY }}
      COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bun run test:update-channel
      - name: Select image and log in
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-updates" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Retain the previous channel snapshot
        run: |
          if docker pull "$IMAGE:latest"; then
            snapshot=$(docker create "$IMAGE:latest")
            mkdir -p "$RUNNER_TEMP/previous-channel"
            docker cp "$snapshot:/srv/update/." "$RUNNER_TEMP/previous-channel/"
            docker rm "$snapshot"
            echo "PREVIOUS_CHANNEL_DIRECTORY=$RUNNER_TEMP/previous-channel" >> "$GITHUB_ENV"
          elif [ "$BOOTSTRAP" != "true" ]; then
            echo 'Cannot retrieve the previous channel; refusing to drop release history.' >&2
            exit 1
          fi
      - name: Verify releases and prepare image contents
        run: bun run infrastructure/update-channel/prepare.ts
      - name: Validate Coolify deployment configuration
        run: |
          bun -e '
            const url = process.env.COOLIFY_DEPLOY_WEBHOOK;
            const token = process.env.COOLIFY_TOKEN;
            const bootstrap = process.env.BOOTSTRAP === "true" && !process.env.PREVIOUS_CHANNEL_DIRECTORY;
            const enabled = Boolean(url || token);
            if (!enabled && !bootstrap) throw new Error("Configure both Coolify secrets before publishing channel updates");
            if (enabled && (!url || !token || new URL(url).protocol !== "https:")) throw new Error("Configure both Coolify secrets with an HTTPS deploy webhook");
            const file = process.env.GITHUB_ENV;
            await Bun.write(file, (await Bun.file(file).text()) + `\nDEPLOY_ENABLED=${enabled}\n`);
          '
      - name: Build and check the complete image
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -t "$IMAGE:latest" infrastructure/update-channel
          docker run --rm "$IMAGE:latest" -t
          docker run -d --name update-channel-check "$IMAGE:latest"
          docker exec update-channel-check wget -q -O /dev/null http://127.0.0.1:8080/healthz
          docker rm -f update-channel-check
      - name: Publish AMD64 and ARM64 image
        run: |
          docker buildx create --driver docker-container --name update-channel-builder --use
          docker buildx build --platform linux/amd64,linux/arm64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -t "$IMAGE:latest" --push infrastructure/update-channel
          docker buildx imagetools inspect "$IMAGE:latest" --raw > "$RUNNER_TEMP/channel-manifest.json"
          bun -e '
            const manifest = await Bun.file(process.env.RUNNER_TEMP + "/channel-manifest.json").json();
            for (const architecture of ["amd64", "arm64"]) {
              if (!manifest.manifests.some(entry => entry.platform?.os === "linux" && entry.platform?.architecture === architecture)) throw new Error(`Published image is missing linux/${architecture}`);
            }
          '
          echo "Image: $IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy through Coolify
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          bun -e '
            const url = process.env.COOLIFY_DEPLOY_WEBHOOK;
            const token = process.env.COOLIFY_TOKEN;
            const response = await fetch(url, { method: "POST", headers: { Authorization: `Bearer ${token}` }, redirect: "error", signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Coolify rejected deployment: HTTP ${response.status}`);
          '
