worker_processes auto;
pid /tmp/nginx.pid;
# Request-scoped error entries embed the request line, including query strings.
# Only process-level failures are logged here; per-request diagnostics come
# from the redacted access log below.
error_log /dev/stderr alert;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Path only ($uri has no query string). Never add $request, $request_uri,
    # $args, $http_authorization, $http_cookie or $request_body.
    log_format pr0_redacted escape=json
        '{"time":"$time_iso8601","client":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout pr0_redacted;
    log_not_found off;

    # Generated at start by render-config.sh: resolver and the pr0_web upstream.
    include /tmp/pr0-ingress/upstream.conf;

    # Only addresses in PR0_INGRESS_TRUSTED_PROXIES may supply X-Forwarded-For.
    # Entries are walked right to left, skipping trusted proxies.
    include /tmp/pr0-ingress/trusted.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Evaluated against the resolved client address.
    geo $pr0_metrics_allowed {
        default 0;
        include /tmp/pr0-ingress/metrics.conf;
    }

    map $http_content_encoding $pr0_compressed {
        "" 0;
        "~*^identity$" 0;
        default 1;
    }

    server {
        listen 8080;
        default_type application/json;

        # The service accepts at most 4 MiB of uncompressed JSON.
        client_max_body_size 4m;
        error_page 413 = @too_large;

        if ($pr0_compressed) {
            return 415 '{"code":"invalid_input"}';
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite, never append or preserve, the authenticated identity.
        include /tmp/pr0-ingress/secret.conf;
        proxy_set_header X-Pr0-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Pr0-Client-Bucket "";
        proxy_set_header X-Pr0-Mail-Reservation "";

        # The long poll waits 25 seconds; responses stream without buffering.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        location @too_large {
            return 413 '{"code":"invalid_input"}';
        }

        location ^~ /api/v1/operations/ {
            if ($pr0_metrics_allowed = 0) {
                return 404 '{"code":"not_found"}';
            }
            proxy_pass http://pr0_web;
        }

        location / {
            proxy_pass http://pr0_web;
        }
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
