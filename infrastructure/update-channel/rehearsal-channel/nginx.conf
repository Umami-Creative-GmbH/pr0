worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        default_type application/octet-stream;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Same layout as the live channel. X-Pr0-Update-Channel lets an
        # operator confirm from a tester's address which channel answered.
        location = /update/ {
            root /srv/update;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Pr0-Update-Channel "rehearsal" always;
            try_files /rehearsal.json =404;
        }

        location /update/releases/ {
            root /srv;
            autoindex off;
            types {
                application/json json;
                application/octet-stream exe sig;
            }
            add_header X-Pr0-Update-Channel "rehearsal" always;
            try_files $uri =404;
        }

        location / {
            add_header X-Pr0-Update-Channel "rehearsal" always;
            return 404;
        }
    }
}
