services:
  updates:
    build:
      context: .
    expose:
      - "8080"
    volumes:
      - type: bind
        source: /data/pr0-updates
        target: /srv/update
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
